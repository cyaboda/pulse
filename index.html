<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="PULSE"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>PULSE · Finanzas personales</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#25302e;background:#f8f9f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:520px;margin:auto;min-height:100dvh;padding:calc(22px + env(safe-area-inset-top)) 22px calc(110px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:31px}.brand-logo{display:block;max-width:172px;width:auto;height:auto;max-height:62px;object-fit:contain;object-position:left center}.circle{border:0;background:#edf0ed;border-radius:50%;width:38px;height:38px;font-size:19px;color:#33413d}.muted{color:#8a9691}.greeting{font-size:16px;margin:0;color:#82908b}.heading{font-size:35px;letter-spacing:-1.4px;margin:3px 0 24px;font-weight:650}.balance{background:#e5f3ee;border-radius:24px;padding:24px;margin-bottom:14px}.eyebrow{font-size:13px;color:#667d74}.money{font-size:39px;letter-spacing:-1.6px;margin:9px 0;font-weight:680}.small{font-size:12px;color:#789188}.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:18px;border-radius:21px;background:#fff}.stat.in{background:#e9f5ed}.stat.out{background:#fbeeea}.stat .amount{font-size:22px;font-weight:650;margin-top:8px;letter-spacing:-.6px}.section{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.section h2{font-size:19px;margin:0;letter-spacing:-.5px}.link{border:0;background:transparent;color:#718a80;font-size:13px}.entry{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid #edf0ed}.emoji{height:43px;width:43px;border-radius:14px;display:grid;place-items:center;background:#f0f3f1;font-size:21px;flex-shrink:0}.entry-main{flex:1;min-width:0}.entry-main strong{font-size:14px;display:block}.entry-main small{font-size:12px;color:#9ba5a0;display:block;margin-top:4px}.entry-value{font-size:14px;font-weight:650}.positive{color:#298765}.negative{color:#dc7775}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);padding:13px 17px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #edf0ed;display:flex;justify-content:space-around;align-items:center}.nav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:#98a39e;font-size:11px;min-width:55px}.nav button.active{color:#377c69}.nav .symbol{font-size:22px}.nav .add{width:51px;height:51px;background:#d8e8f9;border-radius:50%;font-size:29px;color:#376da1;display:grid;place-items:center;box-shadow:0 3px 12px #dbe7f3}.hidden{display:none!important}.pillrow{display:flex;gap:8px;overflow:auto}.pill{border:0;border-radius:22px;padding:10px 16px;background:#edf0ee;color:#7d8883;white-space:nowrap}.pill.selected{background:#dbe9f8;color:#3e6c9e}.panel{background:#fff;border-radius:20px;padding:18px;margin:12px 0}.field{display:flex;flex-direction:column;gap:8px;margin:16px 0;font-size:13px;color:#73827a}.field input,.field select{font:inherit;font-size:16px;padding:15px;border:1px solid #e6eae7;border-radius:14px;background:#fff;color:#26322d;width:100%}.primary{border:0;background:#427f6d;color:#fff;width:100%;padding:17px;border-radius:17px;font-weight:650;font-size:15px}.toggle{display:flex;background:#eef1ef;border-radius:15px;padding:4px;gap:4px}.toggle button{border:0;background:transparent;padding:12px;flex:1;border-radius:12px;color:#6b7872}.toggle button.chosen{background:white;color:#243b32;box-shadow:0 1px 5px #0000000b}.biginput{font-size:42px!important;text-align:center;border:0!important;font-weight:650;margin:15px 0}.empty{color:#94a19b;text-align:center;padding:28px 5px;font-size:14px}.bar{height:11px;background:#edf0ee;border-radius:20px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:#9ccdbb;border-radius:20px}.minirow{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}.chartrow{margin:18px 0}.chartrow .bar{height:9px}.caption{font-size:12px;color:#9aa69f;margin-top:4px}.notice{background:#edf5ee;border-radius:17px;padding:17px;font-size:13px;color:#547765;line-height:1.5}.home-greeting{margin-bottom:24px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #79aa9a;outline-offset:2px}

.dot{color:#86b7a7}.daily-card{background:#e7e9fa;border-radius:24px;padding:23px;margin:14px 0;display:flex;align-items:center;justify-content:space-between}.daily-money{font-size:35px;font-weight:680;letter-spacing:-1.5px;margin:8px 0;color:#343956}.sun{font-size:40px;color:#929bd1}.breakdown{background:#fff}.minirow.total{border-top:1px solid #e9edea;padding-top:13px;font-weight:650}.actionline{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:7px}.tiny{background:#e4f3ec;color:#36755e;border:0;border-radius:11px;padding:7px 12px;font-size:12px;font-weight:700}.delete{border:0;background:transparent;color:#adb4b0;font-size:21px;padding:0 3px}.paid{color:#388a6a;font-size:11px}.warning{background:#fff0e8;color:#a75c42}.entry-value{text-align:right}.entry-main small{line-height:1.4}.nav .add{box-shadow:none}

/* PULSE responsive payment layout */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.shell{width:100%;max-width:520px;min-width:0;margin-inline:auto;padding-left:clamp(16px,4vw,22px);padding-right:clamp(16px,4vw,22px)}
#view{display:block;width:100%;min-width:0;max-width:100%}
.payments-stack,.payments-group{display:block;width:100%;min-width:0;max-width:100%;clear:both}
.payments-stack>.payments-group{margin-bottom:22px}
.payments-stack .section{display:flex;width:100%;min-width:0;align-items:center;justify-content:space-between}
.payments-stack .entry{display:flex;width:100%;min-width:0;flex-wrap:nowrap;gap:10px}
.payments-stack .entry-main{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.payments-stack .entry-value{flex:0 0 auto;max-width:42%;min-width:0;overflow-wrap:anywhere}
.payments-stack .actionline{flex-wrap:wrap;gap:6px}
.payments-stack form.panel{display:block;width:100%;max-width:100%;min-width:0;padding:20px;margin:12px 0}
.payments-stack .field{width:100%;min-width:0}
.payments-stack input,.payments-stack select,.payments-stack button.primary{max-width:100%;min-width:0}
.payments-stack .caption{overflow-wrap:anywhere;line-height:1.6}
@media(max-width:380px){.payments-stack .entry{gap:8px}.payments-stack .emoji{width:36px;height:36px;flex-basis:36px}.payments-stack .entry-value{font-size:13px}.payments-stack form.panel{padding:16px}}

/* Layout móvil estable: nunca poner las tres secciones de pagos en columnas */
.payments-stack{display:flex!important;flex-direction:column!important;gap:0;width:100%;min-width:0}
.payments-group{display:block!important;width:100%!important;max-width:100%!important;flex:none!important;float:none!important}
.payments-group .entry{width:100%;flex-wrap:wrap}
.payments-group .entry-main{min-width:100px;flex:1 1 110px}
.payments-group .entry-value{min-width:88px;max-width:45%;text-align:right}
.payments-group .panel,.payments-group form{width:100%!important;max-width:100%!important}
.payments-group .field input,.payments-group .field select{width:100%;min-width:0}
@media(max-width:350px){.payments-group .entry-value{max-width:100%;margin-left:auto}}
</style></head><body><main class="shell"><header><img class="brand-logo" src="./LOGO.png" alt="PULSE" onerror="this.style.display='none'"><button class="circle" id="export" title="Exportar respaldo">↥</button></header><div id="view"></div></main><nav class="nav"><button data-tab="home" class="active"><span class="symbol">⌂</span>Inicio</button><button data-tab="movements"><span class="symbol">☷</span>Movimientos</button><button data-tab="add"><span class="add">+</span></button><button data-tab="bills"><span class="symbol">▣</span>Pagos</button><button data-tab="analysis"><span class="symbol">▥</span>Análisis</button></nav><script>
'use strict';
const KEY='pulse-finance-v1';
const blank=()=>({transactions:[],bills:[],cards:[],name:'',budget:0,salary:0,reserve:0,payday:30});
let state;try{state={...blank(),...JSON.parse(localStorage.getItem(KEY))}}catch{state=blank()}
for(const k of ['transactions','bills','cards'])if(!Array.isArray(state[k]))state[k]=[];
let tab='home',kind='expense',filter='all',editMonth=null;
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const month=()=>today().slice(0,7), cur=()=>editMonth||month(), dateStr=d=>new Date(d+'T12:00:00').toLocaleDateString('es-EC',{day:'numeric',month:'short'});
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
// Ciclo financiero: desde el cobro anterior hasta el día previo al próximo cobro.
const payDate=(year,monthIndex)=>{const last=new Date(year,monthIndex+1,0).getDate();return new Date(year,monthIndex,Math.min(Number(state.payday)||30,last))};
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const cycle=()=>{const now=new Date();now.setHours(0,0,0,0);let start=payDate(now.getFullYear(),now.getMonth());if(start>now)start=payDate(now.getFullYear(),now.getMonth()-1);let end=payDate(start.getFullYear(),start.getMonth()+1);return {start,end,key:isoDate(start),endKey:isoDate(end)}};
const nextPayDate=()=>cycle().end;
const nextPayLabel=()=>nextPayDate().toLocaleDateString('es-EC',{day:'numeric',month:'long'});
const daysLeft=()=>Math.max(1,Math.round((cycle().end-new Date(new Date().setHours(0,0,0,0)))/86400000));
const entries=()=>{const c=cycle();return state.transactions.filter(t=>t.date>=c.key&&t.date<c.endKey)};
const sum=(a,type)=>a.filter(x=>x.type===type).reduce((n,x)=>n+Number(x.amount||0),0);
const monthlyIncome=()=>sum(entries(),'income')+Number(state.salary||0);
const monthlySpent=()=>sum(entries(),'expense');
const obligations=()=>[...state.bills.map(x=>({...x,kind:'bill'})),...state.cards.map(x=>({...x,kind:'card'}))];
const cardDebt=o=>Math.max(0,Number(o.debt??o.amount??0));
const paid=(o)=>state.transactions.some(t=>t.obligationId===o.id&&t.type==='expense'&&t.date>=cycle().key&&t.date<cycle().endKey);
const unpaid=()=>obligations().filter(o=>o.kind==='bill'&&!paid(o));
const pending=()=>unpaid().reduce((s,o)=>s+Number(o.amount||0),0);
const cash=()=>monthlyIncome()-monthlySpent();
const safe=()=>cash()-pending()-Number(state.reserve||0);
const daily=()=>Math.max(0,safe()/daysLeft());
const icons={'Alimentación':'🍽','Transporte':'🚗','Hogar':'⌂','Salud':'♡','Compras':'▢','Ocio':'✧','Servicios':'⚙','Otros':'••','Ingreso':'↗','Salario':'↗','Negocio':'↗'};
function item(t){return `<div class="entry"><div class="emoji">${icons[t.category]||'↗'}</div><div class="entry-main"><strong>${escapeHtml(t.description)}</strong><small>${escapeHtml(t.category)} · ${dateStr(t.date)}</small></div><div class="entry-value ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div></div>`}
const section=(name,right='')=>`<div class="section"><h2>${name}</h2>${right}</div>`;
function obligationRow(o){const isCard=o.kind==='card';const due=isCard?cardDebt(o):Number(o.amount||0);return `<div class="entry"><div class="emoji">${isCard?'▤':'◷'}</div><div class="entry-main"><strong>${escapeHtml(o.name)}</strong><small>${isCard?'Deuda pendiente':'Suscripción'} · Día ${o.day}${!isCard?' · '+(paid(o)?'Pagado en el ciclo':'Pendiente'):''}</small></div><div class="entry-value">${money(due)}<div class="actionline">${isCard?(due>0?`<button class="tiny" data-pay="${o.id}">Abonar</button>`:'<span class="paid">✓ Sin deuda</span>'):(paid(o)?'<span class="paid">✓ Pagado</span>':`<button class="tiny" data-pay="${o.id}">Pagar</button>`)}<button class="delete" data-delete="${o.id}" data-type="${o.kind}" title="Eliminar">×</button></div></div>`}
function home(){const income=monthlyIncome(),spent=monthlySpent(),rest=safe();return `<p class="greeting home-greeting">Tu dinero, en orden.</p>${!state.salary?`<div class="notice">Empieza configurando tu sueldo mensual en <button class="link" data-go="analysis">Mi presupuesto ›</button></div>`:""}<div class="balance"><span class="eyebrow">Saldo del ciclo</span><div class="money">${money(cash())}</div><span class="small">Saldo estimado · próximo sueldo: ${nextPayLabel()}</span></div><div class="daily-card"><div><span class="eyebrow">Puedes gastar hoy</span><div class="daily-money">${money(daily())}</div><span class="small">${daysLeft()} días · suscripciones reservadas</span></div><span class="sun">✳</span></div><div class="duo"><div class="stat in"><span class="eyebrow">Ingresos</span><div class="amount">${money(income)}</div></div><div class="stat out"><span class="eyebrow">Gastos pagados</span><div class="amount">${money(spent)}</div></div></div><div class="panel breakdown"><div class="minirow"><span>Suscripciones pendientes</span><strong>${money(pending())}</strong></div><div class="minirow"><span>Ahorro reservado</span><strong>${money(state.reserve)}</strong></div><div class="minirow total"><span>Libre para gastar</span><strong class="${rest<0?'negative':'positive'}">${money(rest)}</strong></div></div>${section('Próximos pagos','<button class="link" data-go="bills">Ver todos ›</button>')}${unpaid().length?unpaid().sort((a,b)=>a.day-b.day).slice(0,3).map(obligationRow).join(''):'<div class="empty">No tienes pagos pendientes registrados.</div>'}${section('Últimos movimientos','<button class="link" data-go="movements">Ver todos ›</button>')}${entries().length?entries().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(item).join(''):'<div class="empty">Pulsa + para añadir un movimiento.</div>'}`}
function movements(){let a=entries().slice().sort((x,y)=>y.date.localeCompare(x.date));if(filter!=='all')a=a.filter(t=>t.type===filter);return `<h1 class="heading">Movimientos</h1><div class="pillrow"><button class="pill ${filter==='all'?'selected':''}" data-filter="all">Todos</button><button class="pill ${filter==='income'?'selected':''}" data-filter="income">Ingresos</button><button class="pill ${filter==='expense'?'selected':''}" data-filter="expense">Gastos</button></div>${section('Ciclo actual')}${a.length?a.map(item).join(''):'<div class="empty">No hay movimientos todavía.</div>'}`}
function add(){let cats=kind==='income'?['Ingreso','Negocio','Regalo','Otros']:['Alimentación','Transporte','Hogar','Salud','Compras','Ocio','Servicios','Otros'];return `<h1 class="heading">Nuevo movimiento</h1><div class="toggle"><button data-kind="expense" class="${kind==='expense'?'chosen':''}">Gasto</button><button data-kind="income" class="${kind==='income'?'chosen':''}">Ingreso</button></div><form id="transaction"><label class="field">Importe en USD<input class="biginput" name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required inputmode="decimal"></label><label class="field">Descripción<input name="description" maxlength="90" placeholder="Ej. Supermercado" required></label><label class="field">Categoría<select name="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field">Fecha<input name="date" type="date" value="${today()}" required></label><button class="primary">Guardar movimiento</button></form>`}
function bills(){let o=obligations().sort((a,b)=>a.day-b.day);return `<div class="payments-stack"><h1 class="heading">Mis pagos</h1><div class="notice">Las suscripciones pendientes se reservan del dinero libre. En tarjetas, registra un abono cuando lo realices: se restará de tu deuda y del saldo del ciclo una sola vez.</div><div class="panel"><div class="eyebrow">Suscripciones pendientes</div><div class="money">${money(pending())}</div><span class="small">Ciclo hasta el ${nextPayLabel()}.</span></div><div class="payments-group">${section('Suscripciones')}${o.filter(x=>x.kind==='bill').length?o.filter(x=>x.kind==='bill').map(obligationRow).join(''):'<div class="empty">Todavía no hay suscripciones.</div>'}</div><div class="payments-group">${section('Tarjetas de crédito')}${o.filter(x=>x.kind==='card').length?o.filter(x=>x.kind==='card').map(obligationRow).join(''):'<div class="empty">Todavía no hay tarjetas.</div>'}</div><div class="payments-group">${section('Agregar suscripción o tarjeta')}<form id="obligation" class="panel"><label class="field">Tipo<select name="type" id="obligation-type"><option value="bill">Suscripción o servicio</option><option value="card">Tarjeta de crédito</option></select></label><label class="field">Nombre<input name="name" maxlength="70" placeholder="Ej. Netflix / Visa" required></label><label class="field" id="obligation-amount-label"><span id="amount-label">Importe mensual (USD)</span><input name="amount" type="number" step="0.01" min="0.01" required inputmode="decimal"></label><label class="field">Día de pago cada mes<input name="day" type="number" min="1" max="31" value="15" required></label><button class="primary">Guardar</button></form><p class="caption">Para tarjetas, registra la deuda total actual. Puedes abonar cualquier cantidad cuando quieras. No guardamos números de tarjeta.</p></div></div>`}
function analysis(){let inc=monthlyIncome(),exp=monthlySpent(),groups={};entries().filter(t=>t.type==='expense').forEach(t=>groups[t.category]=(groups[t.category]||0)+Number(t.amount));let sorted=Object.entries(groups).sort((a,b)=>b[1]-a[1]);return `<h1 class="heading">Mi presupuesto</h1><div class="panel"><span class="eyebrow">Recomendación diaria</span><div class="money">${money(daily())}</div><p class="caption">${daysLeft()} días hasta el próximo cobro. Se reservan las suscripciones pendientes y el ahorro. Los abonos de tarjeta se descuentan cuando los registras.</p></div><div class="duo"><div class="stat in"><span class="eyebrow">Ingresos del mes</span><div class="amount">${money(inc)}</div></div><div class="stat out"><span class="eyebrow">Gastos pagados</span><div class="amount">${money(exp)}</div></div></div>${section('Cómo se calcula')}<div class="panel"><div class="minirow"><span>Ingresos</span><strong>${money(inc)}</strong></div><div class="minirow"><span>Gastos realizados</span><strong>−${money(exp)}</strong></div><div class="minirow"><span>Suscripciones pendientes</span><strong>−${money(pending())}</strong></div><div class="minirow"><span>Ahorro reservado</span><strong>−${money(state.reserve)}</strong></div><div class="minirow total"><span>Dinero libre</span><strong>${money(safe())}</strong></div></div>${safe()<0?'<div class="notice warning">Tus compromisos superan el dinero disponible. Conviene revisar tus pagos antes de hacer nuevos gastos.</div>':'<div class="notice">Estimación por ciclo de cobro. El sueldo configurado se considera disponible al inicio del ciclo; verifica tu saldo real antes de gastar. Las tarjetas no se reservan hasta que registres el abono.</div>'}${section('Ahorro que quiero reservar')}<form id="reserve"><label class="field">Apartar cada mes (USD)<input name="reserve" type="number" min="0" step="0.01" value="${Number(state.reserve)||0}" required></label><button class="primary">Actualizar ahorro</button></form>${section('Gastos por categoría')}${sorted.length?sorted.map(([name,val])=>`<div class="chartrow"><div class="minirow"><span>${escapeHtml(name)}</span><strong>${money(val)}</strong></div><div class="bar"><div style="width:${Math.min(100,100*val/exp)}%"></div></div></div>`).join(''):'<div class="empty">Aquí verás tus categorías cuando registres gastos.</div>'}${section('Configurar mi sueldo')}<form id="salary"><label class="field">Sueldo mensual fijo (USD)<input name="salary" type="number" min="0" step="0.01" value="${Number(state.salary)||0}" required></label><label class="field">Día de cobro mensual<input name="payday" type="number" min="1" max="31" value="${Number(state.payday)||30}" required></label><button class="primary">Guardar sueldo y día de cobro</button></form><p class="caption">Tu sueldo se cobra el día 30 (o el último día de febrero). La proyección se calcula desde un cobro hasta el siguiente. Registra otros ingresos en Movimientos para no duplicarlos.</p>`}
function settings(){return `<h1 class="heading">Mi perfil</h1><form id="settings"><label class="field">Mi nombre<input name="name" maxlength="50" value="${escapeHtml(state.name)}" placeholder="Tu nombre"></label><button class="primary">Guardar</button></form><div class="panel"><p class="eyebrow">Tus datos se guardan en este dispositivo</p><button class="primary" id="backup">Descargar respaldo</button><label class="field">Restaurar respaldo JSON<input id="restore" type="file" accept="application/json"></label></div>`}
function render(){const views={home,movements,add,bills,analysis,settings};$('#view').innerHTML=views[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function doPay(o){if(o.kind==='card'){
 const remaining=cardDebt(o);if(remaining<=0){alert('Esta tarjeta no tiene deuda pendiente.');return}
 const input=prompt(`Deuda actual de ${o.name}: ${money(remaining)}\n¿Cuánto abonaste?`,String(Math.min(100,remaining)));
 if(input===null)return;const amount=Number(input.replace(',','.'));
 if(!Number.isFinite(amount)||amount<=0||amount>remaining){alert('Ingresa un abono mayor que cero y no superior a la deuda.');return}
 if(!confirm(`¿Registrar abono de ${money(amount)} a ${o.name}?\nLa deuda quedará en ${money(remaining-amount)} y se descontará del saldo.`))return;
 const original=state.cards.find(c=>c.id===o.id);original.debt=Math.round((remaining-amount)*100)/100;
 state.transactions.push({id:id(),type:'expense',amount,description:'Abono tarjeta · '+o.name,category:'Tarjeta de crédito',date:today(),cardId:o.id});save();render();return;
 }
 if(paid(o)){alert('Esta suscripción ya está pagada en este ciclo.');return}
 if(!confirm(`¿Registrar el pago de ${o.name} por ${money(o.amount)}?`))return;
 state.transactions.push({id:id(),type:'expense',amount:Number(o.amount),description:'Pago · '+o.name,category:'Suscripción',date:today(),obligationId:o.id,obligationMonth:month()});save();render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab||b.dataset.go){tab=b.dataset.tab||b.dataset.go;render();scrollTo(0,0)}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.kind){kind=b.dataset.kind;render()}else if(b.dataset.pay){let o=obligations().find(x=>x.id===b.dataset.pay);if(o)doPay(o)}else if(b.dataset.delete){if(confirm('¿Eliminar este compromiso? Los pagos anteriores se conservarán.')){const k=b.dataset.type==='card'?'cards':'bills';state[k]=state[k].filter(x=>x.id!==b.dataset.delete);save();render()}}else if(b.id==='backup'||b.id==='export'){backup()}});
document.addEventListener('change',e=>{if(e.target.id==='obligation-type'){const label=document.querySelector('#amount-label');if(label)label.textContent=e.target.value==='card'?'Deuda total actual (USD)':'Importe mensual (USD)'}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='transaction'){state.transactions.push({id:id(),type:kind,amount:Number(d.amount),description:d.description.trim(),category:d.category,date:d.date});tab='home'}else if(f.id==='obligation'){state[d.type==='card'?'cards':'bills'].push({id:id(),name:d.name.trim(),...(d.type==='card'?{debt:Number(d.amount)}:{amount:Number(d.amount)}),day:Number(d.day)});tab='bills'}else if(f.id==='salary'){state.salary=Number(d.salary);state.payday=Number(d.payday)||30;tab='home'}else if(f.id==='reserve'){state.reserve=Number(d.reserve)}else if(f.id==='settings'){state.name=d.name.trim();tab='home'}save();render()});
function backup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pulse-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('change',async e=>{if(e.target.id!=='restore')return;try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.transactions)||!Array.isArray(obj.bills))throw Error();if(!confirm('¿Reemplazar todos los datos actuales por este respaldo?'))return;state={...blank(),...obj,cards:Array.isArray(obj.cards)?obj.cards:[]};save();tab='home';render()}catch{alert('El archivo no es un respaldo válido de PULSE.')}});
$('#export').addEventListener('click',()=>{tab='settings';render()});
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
