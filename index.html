 const original=state.cards.find(c=>c.id===o.id);original.debt=Math.round((remaining-amount)*100)/100;

 }

 const userId=crypto.getRandomValues(new Uint8Array(16));const challenge=crypto.getRandomValues(new Uint8Array(32));
 const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:'PULSE Finanzas'},user:{id:userId,name:'pulse-local',displayName:'PULSE'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},attestation:'none'},timeout:60000});
 if(!cred)throw new Error('No se creó la credencial');localStorage.setItem(LOCAL_CREDENTIAL_KEY,encoded(cred.rawId));refreshFace();alert('Acceso con Face ID / Passkey activado en este dispositivo.');
 }catch(err){if(err.name!=='NotAllowedError')alert('No se pudo activar: '+err.message)}}
async function biometricUnlock(){const stored=localStorage.getItem(LOCAL_CREDENTIAL_KEY);if(!stored)return;try{const result=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:decoded(stored)}],userVerification:'required',timeout:60000}});if(result&&encoded(result.rawId)===stored)unlock();else throw new Error('Credencial no coincide')}catch(err){if(err.name!=='NotAllowedError')document.getElementById('lock-error').textContent='No se pudo autenticar. Usa tu código.'}}
faceButton.addEventListener('click',biometricUnlock);
document.addEventListener('click',e=>{if(e.target.closest('#configure-face'))configureBiometric();if(e.target.closest('#lock-now'))lock();if(e.target.closest('#remove-face')){localStorage.removeItem(LOCAL_CREDENTIAL_KEY);refreshFace();alert('Acceso biométrico desactivado en PULSE.')}});
// Lock when returning from the background. iOS can terminate a PWA instead of firing this event.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')lock()});
refreshFace();
